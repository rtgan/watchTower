# https://goframe.org/docs/web/server-config-file-template
server:
  appName: "watchTower"
  host: "0.0.0.0"
  port: 6872
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

log_callback:
  detail: true
  debug: false

ds_think_chat_model:
  api_key: "${ARK_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

ds_quick_chat_model:
  api_key: "${ARK_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

# 豆包的结合版embedding模型（支持文本、图片）
doubao_embedding_model:
  api_key: "${ARK_API_KEY}"
  model: "doubao-embedding-vision-251215"
  vector_dim: "2048"

# 知识库文件目录
file_dir: "/Users/runtinggan/go/src/watchTower/docs"

#腾讯CLS的MCP（备选；token 易失效，推荐用下方 cls 直连）
mcp_url: "https://mcp-api.tencent-cloud.com/sse/${CLS_MCP_TOKEN}"

# 腾讯云 CLS 直连配置（query_log 工具直接调 SearchLog API，绕开 MCP）。
# 若配置了 cls，query_log 使用直连方式；否则回退到 MCP(mcp_url)，MCP 不可用则降级跳过。
# 真实值放 .env（不提交 git），此处为 ${VAR} 占位符。
cls:
  secret_id: "${CLS_SECRET_ID}"
  secret_key: "${CLS_SECRET_KEY}"
  topic_id: "${CLS_TOPIC_ID}"
  endpoint: "${CLS_ENDPOINT}"
  region: "${CLS_REGION}"

# Prometheus HTTP API（query_prometheus_alerts）；不配则默认 http://127.0.0.1:9090
prometheus:
  base_url: "http://127.0.0.1:9090"

milvus:
  address: "localhost:19530"
  db_name: "agent" #库名
  collection_name: "biz" #集合名(表名)

# Google Programmable Search（Custom Search JSON API），可选
# 不配则跳过 google_search 工具，仍可使用 duckduckgo 等
# 申请说明：https://developers.google.com/custom-search/v1/overview
google_search:
  api_key: ""
  search_engine_id: ""


