server:
  appName: "watchTower"
  host: "0.0.0.0"
  port: 6872
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

log_callback:
  detail: true
  debug: false

ds_think_chat_model:
  api_key: "${ARK_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

ds_quick_chat_model:
  api_key: "${ARK_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

doubao_embedding_model:
  api_key: "${ARK_API_KEY}"
  model: "doubao-embedding-vision-251215"
  vector_dim: "2048"

# Docker 容器内的文件目录（仅 KB 业务文档；工程文档不进容器/Milvus）
file_dir: "/app/knowledge"

mcp_url: "https://mcp-api.tencent-cloud.com/sse/${CLS_MCP_TOKEN}"

# Docker 网络内使用服务名 mock-prometheus
prometheus:
  base_url: "http://mock-prometheus:9090"

# Docker 网络内使用服务名 standalone（Milvus 容器名）
milvus:
  address: "standalone:19530"  # 此address用于给客户端连接到容器内的 Milvus 服务
  db_name: "agent"
  collection_name: "biz"

google_search:
  api_key: ""
  search_engine_id: ""
