# ┌──────────── 基础设施层 ────────────┐
# │  etcd ──┐                         │
# │         ├──► Milvus (standalone)   │
# │  minio ─┘        │                │
# │                  └──► Attu (可视化) │
# └────────────────────────────────────┘
# ┌──────────── 应用层 ────────────────┐
# │  mock-prometheus ──► watchtower    │
# │  (告警模拟)        (Go 后端 :6872) │
# │                        ▲           │
# │  frontend (Nginx :8080) │(API调用)  │
# │      ▲                  │          │
# │      └── 浏览器 ────────┘          │
# └────────────────────────────────────┘

services:

  # =================== 基础设施 ===================

  # etcd: 分布式键值存储，用于 Milvus 元数据
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO: 对象存储，用于 Milvus 向量数据
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus: 向量数据库
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # Attu: Milvus 可视化管理
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.6
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: standalone:19530
    depends_on:
      - standalone

  # =================== 应用层 ===================

  # Mock Prometheus: 模拟告警数据
  mock-prometheus:
    container_name: watchtower-mock-prometheus
    build:
      context: ..
      dockerfile: docker/Dockerfile.mock-prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/api/v1/alerts"]
      interval: 10s
      timeout: 5s
      retries: 3

  # watchTower 后端
  watchtower:
    container_name: watchtower-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "6872:6872"
    volumes:
      - ./conf-docker.yml:/app/etc/conf.yml
      - ../docs:/app/docs
    depends_on:
      standalone:
        condition: service_healthy
      mock-prometheus:
        condition: service_healthy
    restart: on-failure

  # 前端 (Nginx)
  frontend:
    container_name: watchtower-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - watchtower

networks:
  default:
    name: milvus
