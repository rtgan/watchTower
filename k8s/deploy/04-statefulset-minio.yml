# MinIO StatefulSet — Milvus 对象存储（替代 S3）
apiVersion: v1
kind: Service
metadata:
  name: milvus-minio
  namespace: watchtower
  labels:
    app: milvus-minio
spec:
  clusterIP: None
  selector:
    app: milvus-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus-minio
  namespace: watchtower
  labels:
    app: milvus-minio
spec:
  serviceName: milvus-minio
  replicas: 1
  selector:
    matchLabels:
      app: milvus-minio
  template:
    metadata:
      labels:
        app: milvus-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-03-20T20-16-18Z
        ports:
        - containerPort: 9000
          name: api
          protocol: TCP
        - containerPort: 9001
          name: console
          protocol: TCP
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        command:
        - minio
        args:
        - server
        - /minio_data
        - --console-address
        - ":9001"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: minio-data
          mountPath: /minio_data
  volumeClaimTemplates:
  - metadata:
      name: minio-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
